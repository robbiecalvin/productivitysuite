<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Personal Expense Tracker</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<main>
  <h1>Expense Tracker</h1>
  <p>Record personal expenses in Canadian dollars.</p>
  <form id="add-expense-form">
    <label for="expense-date">Date</label>
    <input type="date" id="expense-date" required data-testid="expense-date">
    <label for="expense-category">Category</label>
    <input id="expense-category" required maxlength="60" data-testid="expense-category">
    <label for="expense-description">Description (optional)</label>
    <textarea id="expense-description" maxlength="1000" data-testid="expense-description"></textarea>
    <label for="expense-amount">Amount (CAD)</label>
    <input id="expense-amount" required inputmode="decimal" data-testid="expense-amount">
    <button id="add-expense" type="submit" data-testid="add-expense">Add Expense</button>
  </form>
  <section aria-label="Expense list">
    <label for="filter-category">Filter by category</label>
    <input id="filter-category" data-testid="category-filter">
    <button id="apply-filter" type="button" data-testid="apply-filter">Apply Filter</button>
    <ul id="expense-list" data-testid="expense-list"></ul>
    <p>Total: <strong id="expense-total" data-testid="expense-total">CAD $0.00</strong></p>
  </section>
  <p id="error-message" data-testid="error-message" role="alert" hidden></p>
</main>
<script src="/static/app.js"></script>
</body>
</html>
